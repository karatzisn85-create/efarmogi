<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Deep gradient rounded square -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern for tech feel -->
  <line x1="128" y1="80" x2="128" y2="432" stroke="#4338ca" stroke-width="0.5" opacity="0.3"/>
  <line x1="256" y1="80" x2="256" y2="432" stroke="#4338ca" stroke-width="0.5" opacity="0.3"/>
  <line x1="384" y1="80" x2="384" y2="432" stroke="#4338ca" stroke-width="0.5" opacity="0.3"/>
  <line x1="80" y1="170" x2="432" y2="170" stroke="#4338ca" stroke-width="0.5" opacity="0.2"/>
  <line x1="80" y1="340" x2="432" y2="340" stroke="#4338ca" stroke-width="0.5" opacity="0.2"/>

  <!-- Central shield/hexagon shape -->
  <path d="M256 100 L370 160 L370 300 L256 380 L142 300 L142 160 Z" fill="url(#shieldGrad)" opacity="0.08"/>
  <path d="M256 100 L370 160 L370 300 L256 380 L142 300 L142 160 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.5"/>

  <!-- Letter E stylized as building/structure -->
  <rect x="185" y="148" width="142" height="216" rx="12" fill="none" stroke="url(#shieldGrad)" stroke-width="6" opacity="0.9"/>

  <!-- E horizontal bars (representing floors/levels of a project) -->
  <rect x="205" y="175" width="100" height="14" rx="4" fill="url(#accentGrad)" opacity="0.95"/>
  <rect x="205" y="210" width="80" height="14" rx="4" fill="url(#accentGrad)" opacity="0.75"/>
  <rect x="205" y="245" width="90" height="14" rx="4" fill="url(#accentGrad)" opacity="0.6"/>
  <rect x="205" y="280" width="70" height="14" rx="4" fill="url(#accentGrad)" opacity="0.45"/>

  <!-- Checkmark accent (project completion) -->
  <circle cx="340" cy="155" r="28" fill="#10b981" opacity="0.9"/>
  <path d="M326 155 L335 164 L354 145" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Progress/chart bars at bottom -->
  <rect x="175" y="390" width="28" height="60" rx="6" fill="url(#bar1)"/>
  <rect x="215" y="370" width="28" height="80" rx="6" fill="url(#bar2)"/>
  <rect x="255" y="355" width="28" height="95" rx="6" fill="url(#bar3)"/>
  <rect x="295" y="380" width="28" height="70" rx="6" fill="url(#bar1)" opacity="0.7"/>

  <!-- Connecting nodes (network/workflow feel) -->
  <circle cx="172" cy="145" r="6" fill="#818cf8" opacity="0.8"/>
  <circle cx="340" cy="310" r="6" fill="#818cf8" opacity="0.8"/>
  <line x1="172" y1="145" x2="205" y2="175" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="295" y1="280" x2="340" y2="310" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
</svg>
